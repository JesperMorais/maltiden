version: 2

# Dependency update automation.
#
# Philosophy:
#   1. Target `dev` — never open PRs against `main`, since all work flows
#      through dev first.
#   2. Bundle patch + minor updates into a single weekly PR per ecosystem to
#      reduce noise. A failing update doesn't block unrelated bumps.
#   3. Keep major-version bumps as individual PRs so each one can be evaluated
#      against breaking changes. These should rarely auto-merge.
#   4. Consistent commit message prefixes that match the repo's conventional
#      commits style.

updates:
  # ─── Backend (Go modules) ──────────────────────────────────────────────
  - package-ecosystem: gomod
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend"]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      backend-minor-patch:
        applies-to: version-updates
        update-types: ["patch", "minor"]
      backend-security:
        applies-to: security-updates
        patterns: ["*"]

  # ─── Frontend (npm) ────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 10
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    versioning-strategy: increase
    groups:
      # Production dependencies — bundle patch + minor separately from devDeps
      # so a runtime bump doesn't mix with a tooling bump in the same PR.
      frontend-prod-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types: ["patch", "minor"]
      frontend-dev-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types: ["patch", "minor"]
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]
    # Majors get individual PRs (no group matches them) so each breaking
    # change can be evaluated separately. No ignore rule — we still want
    # visibility into major releases.

  # ─── Root-level npm (Playwright test runner) ──────────────────────────
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 3
    labels: ["dependencies", "tests"]
    commit-message:
      prefix: "chore(deps-dev)"
      include: scope
    versioning-strategy: increase
    groups:
      tests-minor-patch:
        applies-to: version-updates
        update-types: ["patch", "minor"]

  # ─── GitHub Actions ────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 3
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
      include: scope
    groups:
      # Actions rarely break — bundle everything, including majors, into one
      # PR per week. CI failures will catch regressions before merge.
      ci-actions:
        applies-to: version-updates
        patterns: ["*"]

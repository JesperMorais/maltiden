version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    labels: ["dependencies", "backend"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    labels: ["dependencies", "frontend"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]

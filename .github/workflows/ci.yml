name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Dependabot PRs run with a read-only GITHUB_TOKEN by default (since 2021).
# dorny/paths-filter@v4 queries the Pull Requests API to compute changed files
# and needs `pull-requests: read` to do that — without this block, dependabot
# PRs fail the "Detect changes" job with no step output, which cascades and
# skips backend/frontend/deploy. `contents: read` is the standard minimum so
# actions/checkout can read the ref. Reads only — no write surface added.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            deploy:
              - 'fly.toml'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Lint seed recipes
        run: |
          if grep -niE '\b(bajs|skit|kuk|fitt|helvete)\b|klicka här|läs mer|click here|read more|&amp;|&nbsp;|&quot;|&#|https?://' migrations/*_seed*.sql; then
            echo "::error::Seed recipe content contains forbidden patterns (profanity, scraping artifacts, HTML entities, or URLs)"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v -race
        env:
          JWT_SECRET: ci-test

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            echo "Run 'gofmt -w backend/' and commit."
            exit 1
          fi

      - name: Vulnerability check
        uses: golang/govulncheck-action@v1
        with:
          work-dir: backend

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: No glassmorphism (backdrop-filter ban)
        run: |
          if grep -rn 'backdrop-filter' src/ --include='*.vue' | grep -v '@media'; then
            echo "backdrop-filter is banned (glassmorphism). See CLAUDE.md."
            exit 1
          fi

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

  deploy-config:
    name: Deploy config
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Validate fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl config validate --config fly.toml

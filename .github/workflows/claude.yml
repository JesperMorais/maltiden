name: Claude Code

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, edited, reopened]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      CLAUDE_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Authenticate gh CLI with Claude OAuth
        run: |
          echo $CLAUDE_OAUTH | gh auth login --with-token

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            You are an automated code assistant.

            Only act when explicit actionable instructions are provided in the @claude comment.

            If no actionable instruction is found:
              - Do nothing.
              - Do not reply.
              - Do not acknowledge.

            Execute the instructions exactly as written.
            Do not infer intent.
            Do not perform fallback actions.

            Keep responses concise, precise, and actionable.

            When referencing code, always include file and line numbers using:
            path/to/file.ts:line_number

          claude_args: |
            --allowedTools "Read,Write,Edit,Bash(git:*),Bash(gh:*),Bash(bun:*),Bash(go:*)"
            --model "claude-opus-4-5"

      - name: Push commits automatically if any
        run: |
          git config user.name "Claude Bot"
          git config user.email "claude-bot@github.com"
          git branch
          git status
          git push origin HEAD
        shell: bash

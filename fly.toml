# fly.toml app configuration file generated for maltiden on 2026-02-05T15:04:42Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'maltiden'
primary_region = 'arn'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[mounts]
  source = 'maltiden_data'
  destination = '/app/data'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

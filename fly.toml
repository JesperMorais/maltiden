# fly.toml app configuration file generated for maltiden on 2026-02-05T15:04:42Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'maltiden'
primary_region = 'arn'

[env]
  DATABASE_PATH = '/app/data/maltiden.db'
  FRONTEND_URL = 'https://maltiden.fly.dev'

[build]
  # FE Sentry DSN. Public-by-design (baked into the JS bundle, write-only event
  # ingestion endpoint). Vite reads VITE_* env vars at build time inside the
  # Dockerfile frontend-builder stage.
  [build.args]
    VITE_SENTRY_DSN_FE = "https://9a35ff7857b417a36397664a128a1537@o4511303410319360.ingest.us.sentry.io/4511303484440576"


[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[mounts]
  source = 'maltiden_data'
  destination = '/app/data'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

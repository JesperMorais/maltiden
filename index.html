<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maträtten - Under konstruktion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #475841 0%, #3F403F 100%);
            color: #E6E8E6;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: #3F403F;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #E6E8E6;
        }
        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: #9FB8AD;
        }
        .message {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #CED0CE;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            background: #475841;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🍽️</div>
        <h1>Maträtten</h1>
        <p class="subtitle">Sidan är under konstruktion</p>
        <p class="message">Vi arbetar på något spännande! Kom tillbaka snart för att se vår nya hemsida.</p>
    </div>
</body>
</html>
